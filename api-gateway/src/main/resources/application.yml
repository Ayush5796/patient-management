server:
  port: 4004

spring:
  cloud:
    gateway:
      routes:
        ## http://localhost:4004/auth/login
        ## API GATEWAY -> http://auth-service:4005/login
        - id: auth-service-root
          #auth-ecs-service-23455354569.aws.com
          uri: http://auth-service:4005
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1

        ## REST-CLIENT -> http://localhost:4000/api/patients
        ## API-Gateway -> http://patient-service:4000/patients
        ## PATIENT SERVICE(SPRING BOOT APP) -> /patients ->Patients Array
        - id: patient-service-route
          uri: http://patient-service:4000
          predicates:
            - Path=/api/patients/**
          filters:
            - StripPrefix=1
            - JwtValidation  # Spring is going to look for a class having name "GatewayFilterFactory" with prefix JwtValidation

        ## REST-CLIENT -> http://localhost:4004/api-docs/patients
        ## API-GATEWAY -> http://patient-service:4000/api/v3/docs
        - id: api-docs-patient-route
          uri: http://patient-service:4000
          predicates:
            - Path=/api-docs/patients
          filters:
            - RewritePath=/api-docs/patients,/v3/api-docs

        - id: api-docs-auth-route
          uri : http://auth-service:4005
          predicates:
            - Path=/api-docs/auth
          filters:
            - RewritePath=/api-docs/auth,/v3/api-docs